<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calcula de ficha RPG.">
<meta property="og:title" content="Ficha RPG">
<meta property="og:description" content="Atualizador automático">
<link rel="stylesheet" href="style.css">
<title>Teste de Ficha RPG</title>
</head>
<body>

<h2 class="other">atualização automática de ficha</h2>

<p class="other">Cole a ficha abaixo:</p>
 <div id="tudocentralizado">
<textarea class="centralizado" id="ficha" rows="20">
</textarea>

<br><br>

<button class="Buton"
    onclick="executarVezes('passarturnovezes', passarTurno)">
    Passar turnos
</button>
<input type="number" id="passarturnovezes"
    placeholder="Quantos turnos?">
<button class="Buton"
    onclick="executarVezes('passarquilometrovezes', () => {
        passarTurno();
        comer();
        beber();
    })">
    PASSAR QUILÔMETROS
</button>
<input type="number" id="passarquilometrovezes"
    placeholder="Quantos quilômetros?">
<button class="Buton"
    onclick="executarVezes('fomevezes', comer)">
    Consumir Fome
</button>
<input type="number" id="fomevezes"
    placeholder="Consumir quantas unidades?">
<button class="Buton"
    onclick="executarVezes('sedevezes', beber)">
    Consumir Sede
</button>
<input type="number" id="sedevezes"
    placeholder="Consumir quantas unidades?">
<button class="Buton" onclick="exportarFichaRPG()">Exportar Ficha (.rpg)</button>
<button class="Buton" onclick="document.getElementById('arquivo').click()"> Importar (.rpg)</button>

<input 
    type="file"
    id="arquivo"
    accept=".rpg"
    style="display: none"
    onchange="importarFicha(event)">


<input type="checkbox" id="tutorialcheck">
<label for="tutorialcheck">Tutorial</label>
</div>
<div id="res">

</div>
</body>
<script src="script.js"></script>
</html>
